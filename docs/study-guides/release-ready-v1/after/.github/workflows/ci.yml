name: Backend CI

# 단위별로 쌓은 PR도 검증해야 하므로 대상 브랜치를 main으로 제한하지 않는다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Core · Server 테스트와 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5

      - name: JDK 21 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v5

      # chmod로 덮으면 저장소의 잘못된 권한을 발견하지 못한다.
      - name: Gradle Wrapper 실행 권한 확인
        run: test -x ./gradlew

      - name: Core 테스트
        run: ./gradlew :core:test --no-daemon

      - name: Server 테스트와 jar 빌드
        run: ./gradlew :server:test :server:bootJar --no-daemon

      - name: 실제 MySQL·HTTP 동시성 및 배포 복원 검증
        run: bash scripts/verify-release.sh

      - name: 테스트 결과 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            core/build/test-results/test/
            core/build/reports/tests/test/
            server/build/test-results/test/
            server/build/reports/tests/test/
            server/build/release-http.log
          if-no-files-found: ignore
          retention-days: 14
