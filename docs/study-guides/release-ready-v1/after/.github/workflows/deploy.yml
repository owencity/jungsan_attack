name: Deploy to OCI

# main 에 push 되면 배포한다. 수동 실행도 열어둔다(workflow_dispatch).
on:
  push:
    branches: [main]
    # 문서만 고쳤을 때 배포까지 도는 건 낭비다.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'design/**'
  workflow_dispatch:

permissions:
  contents: read

# 실행 중인 SSH 배포를 중단하지 않고 뒤의 배포가 기다리게 한다.
concurrency:
  group: deploy-oci
  cancel-in-progress: false

# 이 워크플로는 "언제·어디서" 만 정한다. "무엇을 하는가"는 scripts/deploy/ 안에 있다 —
# 배포가 깨졌을 때 서버에서 같은 스크립트를 손으로 돌려 재현할 수 있어야 하기 때문이다.
env:
  OCI_USER: ubuntu          # Ubuntu 이미지 기본 계정. 숨길 값이 아니라 secret 에 두지 않는다
  REMOTE_DIR: jeongsan      # 서버의 ~/jeongsan

jobs:
  deploy:
    # 수동 실행에서 기능 브랜치를 선택해도 운영에 배포하지 않는다.
    if: github.ref == 'refs/heads/main'
    # OCI 인스턴스가 Canonical-Ubuntu-24.04-aarch64 (ARM64) 로 확인됨.
    # x86 러너에서 만든 이미지는 여기서 exec format error 로 안 뜬다.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 체크아웃
        uses: actions/checkout@v5

      - name: JDK 21 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v5

      # PR 검증과 별개로 실제 배포할 커밋에서도 두 모듈의 테스트를 통과해야 한다.
      - name: 테스트
        run: ./gradlew :core:test :server:test --no-daemon

      - name: jar 빌드
        run: ./gradlew :server:bootJar --no-daemon

      - name: 실제 MySQL·HTTP 릴리스 검증
        run: bash scripts/verify-release.sh

      - name: 도커 이미지 빌드
        run: |
          cp server/build/libs/server.jar server/server.jar
          docker build -t "jeongsan-server:$GITHUB_SHA" ./server
          docker save "jeongsan-server:$GITHUB_SHA" | gzip > "/tmp/jeongsan-server-$GITHUB_SHA.tar.gz"

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_key
          chmod 600 ~/.ssh/id_key
          ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # compose 파일과 스크립트를 통째로 동기화한다. 스크립트가 늘어나도
      # 워크플로를 고칠 필요가 없다 — .env 는 서버에만 있으므로 지우지 않는다.
      - name: compose·스크립트 동기화
        run: |
          ssh -i ~/.ssh/id_key "$OCI_USER@${{ secrets.OCI_HOST }}" \
            "mkdir -p ~/${{ env.REMOTE_DIR }}/scripts/deploy && chmod 700 ~/${{ env.REMOTE_DIR }}"
          rsync -az \
            -e "ssh -i ~/.ssh/id_key" \
            docker-compose.prod.yml \
            "$OCI_USER@${{ secrets.OCI_HOST }}:~/${{ env.REMOTE_DIR }}/"
          rsync -az -e "ssh -i ~/.ssh/id_key" scripts/deploy/ \
            "$OCI_USER@${{ secrets.OCI_HOST }}:~/${{ env.REMOTE_DIR }}/scripts/deploy/"

      - name: 이미지 전송
        run: |
          scp -i ~/.ssh/id_key "/tmp/jeongsan-server-$GITHUB_SHA.tar.gz" \
            "$OCI_USER@${{ secrets.OCI_HOST }}:~/${{ env.REMOTE_DIR }}/"

      - name: 배포
        run: |
          ssh -i ~/.ssh/id_key "$OCI_USER@${{ secrets.OCI_HOST }}" \
            "cd ~/${{ env.REMOTE_DIR }} && bash scripts/deploy/deploy.sh ~/${{ env.REMOTE_DIR }}/jeongsan-server-$GITHUB_SHA.tar.gz jeongsan-server:$GITHUB_SHA"

      - name: 헬스체크
        run: |
          ssh -i ~/.ssh/id_key "$OCI_USER@${{ secrets.OCI_HOST }}" \
            "cd ~/${{ env.REMOTE_DIR }} && bash scripts/deploy/health.sh"
