# OCR을 준비한 운영 서버만 common.sh에서 이 파일을 추가한다.
# 모델과 내부 키가 준비되지 않은 기존 환경은 기존 정산 기능을 그대로 실행한다.
services:
  app:
    environment:
      RECEIPT_OCR_BASE_URL: http://receipt-ocr:8091
      RECEIPT_OCR_SERVICE_KEY: ${RECEIPT_SERVICE_KEY:?OCR 내부 키가 필요합니다}
    networks:
      - default
      - receipt_internal

  receipt-ocr:
    image: ${RECEIPT_IMAGE:?검증한 OCR 이미지 태그가 필요합니다}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      RECEIPT_SERVICE_KEY: ${RECEIPT_SERVICE_KEY:?OCR 내부 키가 필요합니다}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    networks:
      - receipt_internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 3g

networks:
  default: {}
  receipt_internal:
    internal: true
