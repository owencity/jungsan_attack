# 로컬 개발용. OCI 배포 구성과는 별개다 — 실제 배포는 docker-compose.prod.yml +
# .github/workflows/deploy.yml(단일 VM, ADR-006)이 담당한다. ADR-013(k3s/MSA)은
# 보류 상태다(ADR-014) — 재검토 조건이 오기 전엔 그 매니페스트를 쓰지 않는다.
# 이 파일은 로컬에서 server 모듈을 돌리기 위한 MySQL 하나만 띄운다.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local
      MYSQL_DATABASE: jeongsan
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-plocal"]
      interval: 5s
      timeout: 5s
      retries: 10
