# OCI 운영. docker-compose.prod.yml 이 SPRING_PROFILES_ACTIVE=prod 를 준다.
#
# ⚠️ **여기 값에는 기본값을 두지 않는다.** `${VAR}` 에 기본값이 없으면 환경변수가 빠졌을 때
# 부팅이 즉시 실패한다 — 그게 의도다. 빈 값으로 떠버리면 로그인이 나중에 조용히 깨져서
# 원인 찾기가 훨씬 어렵다.
#
# 값의 출처는 서버의 ~/jeongsan/.env (저장소에 없다). docs/DEPLOY.md 참조.

spring:
  datasource:
    # 호스트가 'mysql' 인 이유 — 같은 compose 네트워크 안의 서비스명이다.
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        format_sql: false   # 운영 로그를 SQL 로 채우지 않는다

app:
  frontend-origin: ${FRONTEND_ORIGIN}
  login-success-url: ${LOGIN_SUCCESS_URL}
  # Cloudflare 뒤 HTTPS 라 secure 쿠키를 쓴다 — 평문 연결로는 전송되지 않는다.
  cookie-secure: true

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}

jwt:
  # 반드시 새로 생성한 값이어야 한다 — application-local.yml 의 기본값은 저장소에 공개돼 있어
  # 그대로 쓰면 누구나 토큰을 위조할 수 있다. `openssl rand -base64 48`
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    liquibase: INFO
