databaseChangeLog:
  - changeSet:
      id: 022-enforce-user-groups-admin-definition
      author: jeongsan
      comment: >-
        MySQL에서 addNotNullConstraint와 setColumnRemarks는 컬럼 전체 정의를 각각 다시
        만들기 때문에 한쪽이 다른 쪽의 NOT NULL 또는 COMMENT를 지운다. 관리자 불변식과
        설명을 동시에 보존하도록 최종 컬럼 정의를 한 문장으로 고정한다.
      changes:
        - sql:
            dbms: mysql
            comment: "admin_user_id의 NOT NULL과 COMMENT를 한 ALTER에서 함께 보존한다"
            sql: >-
              ALTER TABLE user_groups
              MODIFY COLUMN admin_user_id BIGINT NOT NULL
              COMMENT '현재 유일한 모임 관리자. created_by_user_id는 생성 이력이고 권한 판단은 이 컬럼만 사용한다. 관리자를 넘겨도 생성자는 바뀌지 않는다.'
