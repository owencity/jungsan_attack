databaseChangeLog:
  - changeSet:
      id: 004-create-gatherings
      author: jeongsan
      comment: >
        host_participant_id 는 participants 테이블이 아직 없어 FK 를 여기서 걸지 못한다
        (순환 참조: gatherings → participants → gatherings). 컬럼만 만들고,
        FK 제약은 004-participants.yaml 마지막 changeSet 에서 나중에 건다.
      changes:
        - createTable:
            tableName: gatherings
            remarks: "모임(1회성 정산 단위). SPEC §4. Round·ExtraItem·Attendance 로부터 매번 재계산하고 결과는 저장하지 않는다(ADR-005)"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  remarks: "모임 고유 id"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: group_id
                  type: BIGINT
                  remarks: "소속 영구 그룹. NULL 이면 그룹 없이 1회성으로 존재(ADR-009)"
                  constraints:
                    nullable: true
                    foreignKeyName: fk_gatherings_group
                    references: groups(id)
              - column:
                  name: name
                  type: VARCHAR(50)
                  remarks: "모임 이름. 예: 8월 팀 회식"
                  constraints:
                    nullable: false
              - column:
                  name: host_user_id
                  type: BIGINT
                  remarks: "주최자 계정"
                  constraints:
                    nullable: false
                    foreignKeyName: fk_gatherings_host_user
                    references: users(id)
              - column:
                  name: host_participant_id
                  type: BIGINT
                  remarks: "주최자 본인의 participants 행. 주최자도 반드시 참여자로 존재한다(대표결제자 후보가 되어야 하므로). FK 는 004 에서 건다"
                  constraints:
                    nullable: true
              - column:
                  name: gathering_date
                  type: DATE
                  remarks: >-
                    모임 날짜. 시각을 붙이지 않는다 — "8월 14일 회식"은 사람의 표현이지
                    순간이 아니다. DATETIME 으로 다루면 KST 오전 9시 이전에 만든 모임이
                    UTC 변환으로 전날이 된다(API.md §0.2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(12)
                  defaultValue: COLLECTING
                  remarks: "COLLECTING | CONFIRMED. 값 검증은 애플리케이션 계층이 한다(core Validator)"
                  constraints:
                    nullable: false
              - column:
                  name: share_token
                  type: VARCHAR(12)
                  remarks: "공유 링크 토큰. 12자·62종·SecureRandom(API.md §3.4). 로그에 남기지 않는다(SPEC §10)"
                  constraints:
                    nullable: false
              - column:
                  name: expected_count
                  type: INT
                  remarks: "본인 포함 예상 인원. 필수 — 정원 초과 시 참여 승인 게이트의 기준(API.md §3.2). 계산에는 쓰지 않는다"
                  constraints:
                    nullable: false
              - column:
                  name: rounding_unit
                  type: INT
                  defaultValue: 10
                  remarks: "반올림 단위. 10 | 100. 1000 은 대표결제자를 음수로 만들어 불허(CALC_RULES T7)"
                  constraints:
                    nullable: false
              - column:
                  name: revision
                  type: INT
                  defaultValueNumeric: 0
                  remarks: "확정할 때마다 +1. 재정산 감지용(SPEC §5-c)"
                  constraints:
                    nullable: false
              - column:
                  name: confirmed_at
                  type: DATETIME
                  remarks: "마지막 확정 시각. UTC. 미확정이면 NULL"
                  constraints:
                    nullable: true
              - column:
                  name: delete_scheduled_at
                  type: DATETIME
                  remarks: "삭제 예정 시각. NULL 이면 정상. 값이 있으면 그 시각에 실제 삭제된다 — 2트랙 삭제(API.md §3.5). 이 기간에도 모임은 정상 동작한다"
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: DATETIME
                  remarks: "모임 생성 시각. UTC"
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: gatherings
            columnNames: share_token
            constraintName: uq_gatherings_share_token
            remarks: "토큰 충돌 시 재생성하도록 애플리케이션이 이 제약 위반을 잡는다"
        - createIndex:
            tableName: gatherings
            indexName: idx_gatherings_group_id
            columns:
              - column:
                  name: group_id
            remarks: "H0 화면에서 그룹별로 묶어 보여줄 때 사용"
        - createIndex:
            tableName: gatherings
            indexName: idx_gatherings_host_user_id
            columns:
              - column:
                  name: host_user_id
            remarks: "H0 내 모임 목록 조회(GET /gatherings)에 사용"
