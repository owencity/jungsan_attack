databaseChangeLog:
  - changeSet:
      id: 021-restore-user-groups-admin-remarks
      author: jeongsan
      comment: >-
        MySQL에서는 addNotNullConstraint가 컬럼 정의를 다시 만들면서 기존 COMMENT를
        보존하지 않는다. 018에서 admin_user_id를 NOT NULL로 바꾼 뒤 사라진 관리자
        컬럼 설명을 별도 changeSet으로 복원한다.
      changes:
        - setColumnRemarks:
            tableName: user_groups
            columnName: admin_user_id
            columnDataType: BIGINT
            remarks: >-
              현재 유일한 모임 관리자. created_by_user_id는 생성 이력이고 권한 판단은
              이 컬럼만 사용한다. 관리자를 넘겨도 생성자는 바뀌지 않는다.
