databaseChangeLog:
  # 2026-08-23 결정사항 반영 (DEVLOG 참조).
  #   - 총무가 모임을 만들 때 번개(FLASH) / 주기(RECURRING) 를 고른다
  #   - 모임 참여는 총무가 공유하는 링크로만 가능하다 — 공개 검색·브라우징이 없다
  #   - 번개모임은 정산 확정 +14일에 목록에서 사라진다(소프트 삭제). 주기모임은 만료가 없다
  #
  # gatherings.share_token 은 그대로 둔다. 링크가 두 종류로 나뉜다 —
  #   /gr/{token}  모임 가입 (groups.share_token, 아래에서 추가)
  #   /g/{token}   술자리 참여 (gatherings.share_token, 기존)
  # 모임에 안 든 사람도 특정 술자리에만 초대할 수 있어야 해서 둘 다 유지한다.

  - changeSet:
      id: 013-add-groups-type
      author: jeongsan
      comment: >-
        번개/주기 구분. Group 을 새 테이블로 나누지 않고 타입 컬럼 하나로 처리한다 —
        ADR-009 가 "이름·구조를 바꾸지 않는다"고 못박은 이유(테스트·엔드포인트·화면 의존)가 여기도 적용된다.
      changes:
        - addColumn:
            tableName: groups
            columns:
              - column:
                  name: group_type
                  type: VARCHAR(10)
                  defaultValue: RECURRING
                  remarks: >-
                    FLASH(번개, 1회성) | RECURRING(주기적). 값 검증은 애플리케이션 계층이 한다.
                    FLASH 는 생성 시 Gathering 1개를 함께 만들고, 정산 확정 +14일에 소프트 삭제된다.
                  constraints:
                    nullable: false

  - changeSet:
      id: 014-add-groups-share-token
      author: jeongsan
      comment: >-
        모임 가입 링크. gatherings.share_token 과 같은 규격(12자·62종·SecureRandom)을 쓴다.
        ADR-007 의 OG 최적화는 하지 않는다 — 모임 초대는 이미 아는 사람끼리 주고받는다.
      changes:
        - addColumn:
            tableName: groups
            columns:
              - column:
                  name: share_token
                  type: VARCHAR(12)
                  remarks: >-
                    모임 가입 링크 토큰(/gr/{token}). 12자·62종·SecureRandom.
                    로그에 남기지 않는다(SPEC §10). 기존 행을 위해 nullable 로 두고
                    애플리케이션이 생성 시 항상 채운다.
                  constraints:
                    nullable: true
        - addUniqueConstraint:
            tableName: groups
            columnNames: share_token
            constraintName: uq_groups_share_token
            remarks: "토큰 충돌 시 재생성하도록 애플리케이션이 이 제약 위반을 잡는다 — gatherings 와 같은 방식"

  - changeSet:
      id: 015-add-groups-soft-delete
      author: jeongsan
      comment: >-
        번개모임 소프트 삭제. 목록에서만 사라지고 결제 내역에서는 계속 보인다 —
        그래서 행을 실제로 지우지 않는다.
      changes:
        - addColumn:
            tableName: groups
            columns:
              - column:
                  name: deleted_at
                  type: DATETIME
                  remarks: >-
                    소프트 삭제 시각. UTC. NULL 이면 살아있다.
                    모임 목록 조회는 deleted_at IS NULL 로 거른다.
                    결제 내역(id 직접 접근)은 이 값을 무시하고 그대로 보여준다.
                  constraints:
                    nullable: true
              - column:
                  name: delete_scheduled_at
                  type: DATETIME
                  remarks: >-
                    삭제 예정 시각. UTC. FLASH 모임의 정산이 확정될 때 확정시각 + 14일로 채운다.
                    RECURRING 은 항상 NULL — 만료가 없다.
                    스케줄러가 이 시각을 지난 행의 deleted_at 을 채운다.
                  constraints:
                    nullable: true
        - createIndex:
            tableName: groups
            indexName: idx_groups_delete_scheduled_at
            columns:
              - column:
                  name: delete_scheduled_at
            remarks: "삭제 스케줄러가 '지금 지워야 할 것'만 뽑을 때 쓴다 — 전체 스캔을 막는다"
