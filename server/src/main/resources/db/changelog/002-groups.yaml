databaseChangeLog:
  - changeSet:
      id: 002-create-groups
      author: jeongsan
      comment: "ADR-009. 영구 모임. 참여는 자동화하지 않는다 — group_members 는 소속만 기록한다"
      changes:
        - createTable:
            tableName: groups
            remarks: "영구 지속 모임(신림팸 등). Gathering(회차)을 여러 개 묶는 컨테이너. ADR-009"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  remarks: "그룹 고유 id"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  remarks: "그룹 이름. 예: 신림팸"
                  constraints:
                    nullable: false
              - column:
                  name: created_by_user_id
                  type: BIGINT
                  remarks: "그룹을 만든 사용자. 반드시 OWNER 로 group_members 에도 존재해야 한다(애플리케이션이 같은 트랜잭션에서 보장)"
                  constraints:
                    nullable: false
                    foreignKeyName: fk_groups_created_by_user
                    references: users(id)
              - column:
                  name: created_at
                  type: DATETIME
                  remarks: "그룹 생성 시각. UTC"
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-create-group-members
      author: jeongsan
      comment: "ADR-009. Group 소속만 기록한다 — 다음 Gathering 참여를 자동으로 만들지 않는다"
      changes:
        - createTable:
            tableName: group_members
            remarks: "그룹 소속. 사용자 1명당 그룹 1개에 행 1개(같은 조합 재가입 없음)"
            columns:
              - column:
                  name: group_id
                  type: BIGINT
                  remarks: "소속된 그룹"
                  constraints:
                    nullable: false
                    foreignKeyName: fk_group_members_group
                    references: groups(id)
              - column:
                  name: user_id
                  type: BIGINT
                  remarks: "소속된 사용자"
                  constraints:
                    nullable: false
                    foreignKeyName: fk_group_members_user
                    references: users(id)
              - column:
                  name: role
                  type: VARCHAR(10)
                  defaultValue: MEMBER
                  remarks: "OWNER | MEMBER. 값 검증은 애플리케이션 계층이 한다"
                  constraints:
                    nullable: false
              - column:
                  name: joined_at
                  type: DATETIME
                  remarks: "그룹에 들어온 시각. UTC"
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: group_members
            columnNames: group_id, user_id
            constraintName: pk_group_members
            remarks: "복합 PK 자체가 유니크 제약이다 — 같은 사용자가 같은 그룹에 두 번 못 들어온다"
