# 프로파일과 무관한 공통 설정만 여기 둔다.
# 환경마다 갈리는 값은 application-local.yml / application-prod.yml 로 나뉜다.
#
#   local  기본값. 그냥 ./gradlew :server:bootRun 하면 이걸로 뜬다
#   prod   OCI 배포용. docker-compose.prod.yml 이 SPRING_PROFILES_ACTIVE=prod 를 준다
#
# staging 은 없다 — 서버가 한 대뿐이라 둘로 충분하다(ADR-006).

spring:
  application:
    name: jeongsan-server

  profiles:
    default: local

  jpa:
    # ddl-auto: none 고정 (SPEC §10). 스키마는 Liquibase 가 유일하게 다룬다 —
    # Hibernate 가 스스로 테이블을 만들거나 고치게 두지 않는다.
    hibernate:
      ddl-auto: none
    open-in-view: false   # 트랜잭션 경계를 서비스 계층에 명확히 두기 위해 끈다

  liquibase:
    # 기본값(classpath:db/changelog/db.changelog-master.yaml)과 실제 경로가 일치한다.
    enabled: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  # 만료는 환경과 무관하다. 시크릿만 프로파일별로 다르다.
  expiration-days: ${JWT_EXPIRATION_DAYS:30}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never   # 내부 구성(DB 호스트 등)이 노출되지 않게
