name: Receipt OCR CI

on:
  pull_request:
    paths:
      - 'receipt-ocr/**'
      - '.github/workflows/receipt-ocr.yml'
  push:
    branches: [main]
    paths:
      - 'receipt-ocr/**'
      - '.github/workflows/receipt-ocr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: receipt-ocr
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'receipt-ocr/requirements-*.txt'
      - name: 테스트 환경 설치
        run: python -m pip install -r requirements-test.txt
      - name: 추출 정책·업로드·권한·동시 요청 테스트
        run: python -m unittest discover -s tests -v
      - name: OCR 토큰 예제 실행
        run: python -m receipt_ocr --tokens examples/receipt-tokens.json

  arm-runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: 한글 합성 영수증용 글꼴 준비
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 운영과 같은 ARM 이미지 빌드
        run: docker build --tag receipt-ocr:verify receipt-ocr
      - name: 인터넷 없이 CPU·메모리를 제한해 실행
        run: |
          test "$(uname -m)" = "aarch64"
          # CI만 사용하는 가짜 키이며 사용자 계정·운영 키와 관계없다.
          docker run -d --init --name receipt-ocr-verify --network none --cpus 1 --memory 3g --memory-swap 3g \
            --restart unless-stopped --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            -e RECEIPT_SERVICE_KEY=ci-only-receipt-key-not-used-outside-this-job \
            -v /usr/share/fonts/opentype/noto:/smoke-font:ro receipt-ocr:verify
          for attempt in $(seq 1 48); do
            if docker exec receipt-ocr-verify python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2).close()" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo 'OCR startup did not become ready'
          exit 1
      - name: 실제 추론·빈 사진·손상·인증·동시 요청 검사
        run: docker exec receipt-ocr-verify python tools/smoke_runtime.py --font /smoke-font/NotoSansCJK-Regular.ttc
      - name: 멈춘 요청의 강제 종료와 모델 재다운로드 없는 재기동 확인
        run: |
          # PID 1이 끝나면 docker exec도 종료될 수 있으므로 실제 RestartCount와 복구로 판단한다.
          before=$(docker inspect --format '{{.RestartCount}}' receipt-ocr-verify)
          docker exec receipt-ocr-verify python tools/check_deadline.py || true
          docker logs receipt-ocr-verify 2>&1 | grep -q 'RECEIPT_DEADLINE_EXCEEDED stage=request'
          for attempt in $(seq 1 48); do
            count=$(docker inspect --format '{{.RestartCount}}' receipt-ocr-verify)
            if [ "$count" -gt "$before" ] && docker exec receipt-ocr-verify python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2).close()" >/dev/null 2>&1; then
              docker exec receipt-ocr-verify python tools/smoke_runtime.py --font /smoke-font/NotoSansCJK-Regular.ttc
              exit 0
            fi
            sleep 5
          done
          echo 'OCR container did not recover'
          exit 1
      - name: 자원 상태 기록
        if: always()
        run: |
          docker stats --no-stream receipt-ocr-verify || true
          docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}' receipt-ocr-verify || true
          docker exec receipt-ocr-verify python -c "from pathlib import Path; p=Path('/sys/fs/cgroup/memory.peak'); print('memory_peak_bytes=' + p.read_text().strip() if p.exists() else 'memory_peak_unavailable')" || true
      - name: 컨테이너 정리
        if: always()
        run: docker rm -f receipt-ocr-verify || true
