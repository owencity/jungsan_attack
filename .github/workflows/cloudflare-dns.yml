name: Cloudflare API DNS

# 토큰은 main의 명시적 운영 실행에서만 사용한다. PR 코드는 운영 DNS를 수정하지 않는다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-api-dns
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: 정산어택 새 호스트 DNS 확인·맞춤
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TUNNEL_ID: ${{ vars.CLOUDFLARE_TUNNEL_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: python3 scripts/cloudflare-dns.py
