name: Deploy to OCI

# main 에 push 되면 배포한다. 수동 실행도 열어둔다(workflow_dispatch).
on:
  push:
    branches: [main]
    # 문서만 고쳤을 때 배포까지 도는 건 낭비다.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'design/**'
  workflow_dispatch:

# 배포가 겹치면 서로 덮어써서 상태가 꼬인다. 앞선 배포는 취소한다.
concurrency:
  group: deploy-oci
  cancel-in-progress: true

# 이 워크플로는 "언제·어디서" 만 정한다. "무엇을 하는가"는 scripts/deploy/ 안에 있다 —
# 배포가 깨졌을 때 서버에서 같은 스크립트를 손으로 돌려 재현할 수 있어야 하기 때문이다.
env:
  OCI_USER: ubuntu          # Ubuntu 이미지 기본 계정. 숨길 값이 아니라 secret 에 두지 않는다
  REMOTE_DIR: jeongsan      # 서버의 ~/jeongsan

jobs:
  deploy:
    # OCI 인스턴스가 Canonical-Ubuntu-24.04-aarch64 (ARM64) 로 확인됨.
    # x86 러너에서 만든 이미지는 여기서 exec format error 로 안 뜬다.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      # core 는 순수 계산 엔진이라 Spring·DB 없이 몇 초면 끝난다(46개 테스트).
      # 이걸 통과 못 하면 서버까지 갈 이유가 없다.
      - name: 테스트
        run: ./gradlew :core:test --no-daemon

      - name: jar 빌드
        run: ./gradlew :server:bootJar --no-daemon

      - name: 도커 이미지 빌드
        run: |
          cp server/build/libs/server.jar server/server.jar
          docker build -t jeongsan-server:latest ./server
          docker save jeongsan-server:latest | gzip > /tmp/jeongsan-server.tar.gz
          ls -lh /tmp/jeongsan-server.tar.gz

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_key
          chmod 600 ~/.ssh/id_key
          ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # compose 파일과 스크립트를 통째로 동기화한다. 스크립트가 늘어나도
      # 워크플로를 고칠 필요가 없다 — .env 는 서버에만 있으므로 지우지 않는다.
      - name: compose·스크립트 동기화
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_key" \
            docker-compose.prod.yml scripts/ \
            "$OCI_USER@${{ secrets.OCI_HOST }}:~/${{ env.REMOTE_DIR }}/scripts_tmp/"
          ssh -i ~/.ssh/id_key "$OCI_USER@${{ secrets.OCI_HOST }}" "
            set -e
            cd ~/${{ env.REMOTE_DIR }}
            mv scripts_tmp/docker-compose.prod.yml ./
            rm -rf scripts && mv scripts_tmp scripts
          "

      - name: 이미지 전송
        run: |
          scp -i ~/.ssh/id_key /tmp/jeongsan-server.tar.gz \
            "$OCI_USER@${{ secrets.OCI_HOST }}:~/${{ env.REMOTE_DIR }}/"

      - name: 배포
        run: |
          ssh -i ~/.ssh/id_key "$OCI_USER@${{ secrets.OCI_HOST }}" \
            "cd ~/${{ env.REMOTE_DIR }} && bash scripts/deploy/deploy.sh ~/${{ env.REMOTE_DIR }}/jeongsan-server.tar.gz"

      - name: 헬스체크
        run: |
          ssh -i ~/.ssh/id_key "$OCI_USER@${{ secrets.OCI_HOST }}" \
            "cd ~/${{ env.REMOTE_DIR }} && bash scripts/deploy/health.sh"
